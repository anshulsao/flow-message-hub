<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flow Hub</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --bg:#0B0E14; --panel:#111725; --panel-2:#0E1420; --line:#1E2839; --hover:#151D2D; --sel:#18243A;
    --ink:#EAF0F8; --muted:#93A2B8; --faint:#5C6A80;
    --accent:#F0A32E; --live:#2FD4C6; --done:#3CCB72; --info:#4CA3FF;
    --warn:#F0A32E; --bad:#E8873B; --urgent:#FF5D52; --watch:#7E84F2;
    --live-soft:rgba(47,212,198,.12); --warn-soft:rgba(240,163,46,.12); --bad-soft:rgba(232,135,59,.14);
    --done-soft:rgba(60,203,114,.12); --info-soft:rgba(76,163,255,.12);
  }
  :root[data-theme="light"]{
    --bg:#EEF1F6; --panel:#FFFFFF; --panel-2:#F5F8FC; --line:#E1E7F0; --hover:#F0F4FA; --sel:#E6EEF9;
    --ink:#141C2B; --muted:#54617A; --faint:#8A97AD;
    --accent:#C97A1F; --live:#0E938B; --done:#1F9B54; --info:#2C6FD6;
    --warn:#B86E12; --bad:#B45309; --urgent:#DA3B2E; --watch:#5E63C9;
    --live-soft:rgba(14,147,139,.10); --warn-soft:rgba(201,122,31,.12); --bad-soft:rgba(180,83,9,.10);
    --done-soft:rgba(31,155,84,.10); --info-soft:rgba(44,111,214,.10);
  }
  *{box-sizing:border-box;}
  [hidden]{display:none!important;}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:"IBM Plex Mono",monospace;}
  button{font:inherit;color:inherit;}

  .app{display:grid;grid-template-rows:48px 1fr;height:100%;}
  .top{display:flex;align-items:center;gap:18px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--panel);}
  .brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.01em;}
  .logo{width:18px;height:18px;border-radius:5px;background:conic-gradient(from 210deg,var(--accent),var(--live),var(--accent));}
  .tabs{display:flex;gap:2px;height:100%;}
  .tab{background:none;border:0;border-bottom:2px solid transparent;padding:0 14px;cursor:pointer;color:var(--muted);font-weight:500;}
  .tab:hover{color:var(--ink);}
  .tab.on{color:var(--ink);border-bottom-color:var(--accent);}
  .top .right{margin-left:auto;display:flex;align-items:center;gap:12px;}
  .conn{font-size:11.5px;color:var(--faint);display:flex;align-items:center;gap:6px;}
  .beacon{width:7px;height:7px;border-radius:50%;background:var(--faint);}
  .beacon.ok{background:var(--done);box-shadow:0 0 0 3px var(--done-soft);}
  .beacon.bad{background:var(--urgent);}
  .ibtn{background:var(--panel-2);border:1px solid var(--line);border-radius:7px;height:28px;min-width:28px;cursor:pointer;color:var(--muted);}
  .ibtn:hover{color:var(--ink);}

  .view{min-height:0;}
  #graphview iframe{border:0;width:100%;height:100%;display:block;background:var(--bg);}

  /* ---------- channels: 3 panes ---------- */
  .ch{display:grid;grid-template-columns:250px minmax(0,1fr) minmax(360px,460px);height:100%;}
  .pane{min-height:0;overflow:auto;}
  .side{background:var(--panel-2);border-right:1px solid var(--line);padding:12px 8px 24px;}
  .sec-h{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:12px 10px 6px;display:flex;align-items:center;gap:6px;}
  .sec-h .n{margin-left:auto;font-family:"IBM Plex Mono",monospace;letter-spacing:0;}
  .find{width:calc(100% - 12px);margin:0 6px 4px;height:30px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:0 10px;font:13px "IBM Plex Sans",sans-serif;}
  .find::placeholder{color:var(--faint);}
  .row{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;cursor:pointer;color:var(--muted);white-space:nowrap;}
  .row:hover{background:var(--hover);color:var(--ink);}
  .row.on{background:var(--sel);color:var(--ink);}
  .row .nm{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;}
  .row.unread .nm{color:var(--ink);font-weight:600;}
  .row .hash{color:var(--faint);font-family:"IBM Plex Mono",monospace;}
  .row .meta{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);}
  .badge{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;border-radius:999px;padding:0 6px;line-height:17px;}
  .badge.att{background:var(--bad-soft);color:var(--bad);}
  .badge.live{background:var(--live-soft);color:var(--live);}
  .empty-s{color:var(--faint);font-size:12px;padding:4px 10px;}

  .dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .dot.live{background:var(--live);box-shadow:0 0 0 3px var(--live-soft);animation:pulse 1.8s ease-in-out infinite;}
  .dot.idle{background:var(--info);}
  .dot.crashed{background:var(--bad);}
  .dot.att{background:var(--warn);}
  .dot.done{background:var(--done);}
  .dot.backlog{background:transparent;border:1.5px solid var(--faint);}
  @keyframes pulse{50%{box-shadow:0 0 0 6px transparent;}}

  /* middle */
  .mid{background:var(--bg);}
  .mid-h{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px 10px;}
  .mid-h h2{margin:0;font-size:17px;display:flex;align-items:baseline;gap:8px;}
  .mid-h h2 .hash{color:var(--faint);font-weight:500;}
  .mid-h .sub{font-size:12px;color:var(--faint);margin-top:2px;font-family:"IBM Plex Mono",monospace;}
  .filters{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;}
  .flt{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:2px 11px;font-size:12px;cursor:pointer;color:var(--muted);}
  .flt.on{border-color:var(--accent);color:var(--ink);background:var(--warn-soft);}
  .flt .c{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);margin-left:4px;}
  .list{padding:6px 14px 40px;}
  .grp-h{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:16px 8px 6px;}
  .sub-h{display:flex;align-items:center;gap:6px;font:600 11.5px "IBM Plex Sans",sans-serif;color:var(--muted);padding:8px 10px 4px 12px;}
  .sub-h .n{font:11px "IBM Plex Mono",monospace;color:var(--faint);}
  .lead{display:flex;align-items:flex-start;justify-content:center;padding-top:6px;}
  .lead .pick{display:none;margin:0;width:14px;height:14px;accent-color:var(--accent);cursor:pointer;}
  .lead .dot{margin-top:0!important;}
  .card:hover .lead .pick,.selecting .lead .pick{display:block;}
  .card:hover .lead .dot,.selecting .lead .dot{display:none;}
  .card.picked{background:var(--warn-soft);border-color:var(--accent);}
  .bulkbar{position:sticky;top:0;z-index:3;display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:8px 14px 0;padding:8px 12px;border:1px solid var(--accent);border-radius:9px;background:var(--panel);font-size:12.5px;}
  .bulkbar .sep{color:var(--faint);margin:0 4px 0 6px;font-size:12px;}
  .bb{border:1px solid var(--line);background:var(--panel-2);border-radius:7px;padding:2px 10px;font-size:12px;cursor:pointer;color:var(--ink);}
  .bb:hover:not(:disabled){border-color:var(--accent);}
  .bb.ghost{background:none;color:var(--muted);}
  .bb.warn{border-color:var(--bad);color:var(--bad);background:var(--bad-soft);}
  .bulkres{flex-basis:100%;font:11.5px "IBM Plex Mono",monospace;color:var(--muted);margin-top:4px;}
  .bulkres ul{margin:4px 0 0;padding-left:16px;color:var(--bad);}
  .card{display:grid;grid-template-columns:14px 1fr auto;gap:2px 10px;padding:10px 12px;border-radius:9px;border:1px solid transparent;cursor:pointer;margin-bottom:2px;}
  .card:hover{background:var(--hover);}
  .card.on{background:var(--sel);border-color:var(--line);}
  .card .dot{margin-top:6px;}
  .card .slug{font-family:"IBM Plex Mono",monospace;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card .name{grid-column:2/4;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card .latest{grid-column:2/4;font-size:13px;color:var(--ink);opacity:.9;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px;}
  .card .latest:before{content:"\201C";color:var(--faint);}
  .card .latest:after{content:"\201D";color:var(--faint);}
  .card .foot{grid-column:2/4;font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;}
  .pill{font-family:"IBM Plex Mono",monospace;font-size:10.5px;font-weight:600;padding:1px 8px;border-radius:999px;white-space:nowrap;align-self:start;}
  .pill.live{background:var(--live-soft);color:var(--live);}
  .pill.idle{background:var(--info-soft);color:var(--info);}
  .pill.att{background:var(--warn-soft);color:var(--warn);}
  .pill.crashed{background:var(--bad-soft);color:var(--bad);}
  .pill.done{background:var(--done-soft);color:var(--done);}
  .pill.backlog{background:var(--hover);color:var(--faint);}
  .pri-high{color:var(--urgent);}
  .fold{display:flex;flex-wrap:wrap;gap:4px 12px;padding:8px 12px;font-family:"IBM Plex Mono",monospace;font-size:12px;color:var(--muted);}
  .fold a{color:var(--muted);text-decoration:none;cursor:pointer;}
  .fold a:hover{color:var(--ink);text-decoration:underline;}
  .fold .more{color:var(--accent);}
  .placeholder{color:var(--faint);text-align:center;padding:80px 20px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;}

  /* thread */
  .thread{background:var(--panel);border-left:1px solid var(--line);}
  .th-h{position:sticky;top:0;z-index:2;background:var(--panel);border-bottom:1px solid var(--line);padding:14px 18px 12px;}
  .th-h .slug{font-family:"IBM Plex Mono",monospace;font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;}
  .th-h .slug .x{margin-left:auto;}
  .th-h .name{color:var(--muted);font-size:13px;margin-top:3px;}
  .th-h .facts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .fact{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;}
  .brief{margin:14px 18px 6px;padding:12px 14px;border:1px solid var(--line);border-radius:9px;background:var(--panel-2);font-size:13px;position:relative;}
  .brief .lbl{font-size:10.5px;font-weight:600;letter-spacing:.09em;color:var(--faint);text-transform:uppercase;margin-bottom:6px;}
  .brief.clip .md{max-height:190px;overflow:hidden;mask-image:linear-gradient(180deg,#000 70%,transparent);-webkit-mask-image:linear-gradient(180deg,#000 70%,transparent);}
  .brief .tog{background:none;border:0;color:var(--accent);cursor:pointer;padding:6px 0 0;font-size:12px;}
  .md h1,.md h2,.md h3,.md h4{font-size:13.5px;margin:10px 0 4px;}
  .md h1:first-child,.md h2:first-child,.md h3:first-child{margin-top:0;}
  .md p{margin:4px 0;}
  .md ul{margin:4px 0;padding-left:18px;}
  .md code{font-family:"IBM Plex Mono",monospace;font-size:12px;background:var(--hover);padding:0 4px;border-radius:4px;}
  .md pre{font-family:"IBM Plex Mono",monospace;font-size:11.5px;background:var(--hover);padding:8px;border-radius:6px;overflow:auto;white-space:pre;}
  .ev{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:8px 18px;}
  .ev:hover{background:var(--panel-2);}
  .ev .t{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);padding-top:2px;text-align:right;}
  .ev .k{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);flex-wrap:wrap;}
  .tagk{font-family:"IBM Plex Mono",monospace;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:0 6px;border-radius:4px;line-height:16px;}
  .tagk.auto{background:var(--live-soft);color:var(--live);}
  .tagk.note{background:var(--hover);color:var(--muted);}
  .tagk.message{background:var(--info-soft);color:var(--info);}
  .tagk.broadcast{background:rgba(126,132,242,.14);color:var(--watch);}
  .tagk.urgent{background:var(--urgent);color:#fff;}
  .ev .who{font-family:"IBM Plex Mono",monospace;font-size:11.5px;}
  .ev .body{font-size:13px;margin-top:3px;white-space:pre-wrap;word-break:break-word;}
  .ev .body.you{border-left:2px solid var(--accent);padding-left:8px;}
  .ev details summary{cursor:pointer;font-size:13px;margin-top:2px;list-style:none;}
  .ev details summary::-webkit-details-marker{display:none;}
  .ev details summary:after{content:"  show";color:var(--accent);font-size:11.5px;}
  .ev details[open] summary:after{content:"  hide";}
  .ev details .md{margin-top:6px;padding:8px 10px;border-radius:7px;background:var(--panel-2);border:1px solid var(--line);font-size:12.5px;}
  .day{font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);padding:14px 18px 4px;}
  .readonly{font-size:11.5px;color:var(--faint);text-align:center;padding:14px 18px 30px;font-family:"IBM Plex Mono",monospace;}


  /* chat (session transcript) */
  .chat{padding:4px 0 10px;}
  .msg{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:7px 18px;}
  .msg:hover{background:var(--panel-2);}
  .av{width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:600 11px "IBM Plex Mono",monospace;}
  .av.you{background:var(--warn-soft);color:var(--accent);}
  .av.agent{background:var(--live-soft);color:var(--live);}
  .msg .hd{display:flex;align-items:baseline;gap:8px;font-size:12.5px;}
  .msg .hd b{font-weight:600;}
  .msg .hd .tm{font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--faint);}
  .msg .tx{font-size:13.5px;margin-top:1px;word-break:break-word;}
  .msg.you .tx{white-space:pre-wrap;}
  .msg .tx.md p{margin:3px 0;}
  .tl{display:flex;align-items:center;gap:8px;padding:2px 18px 2px 58px;font:11px "IBM Plex Mono",monospace;color:var(--faint);}
  .ms{display:flex;gap:8px;align-items:flex-start;margin:6px 18px 6px 58px;padding:6px 10px;border-radius:8px;border:1px dashed var(--line);font-size:12px;color:var(--muted);}
  .ms .tm{font:10.5px "IBM Plex Mono",monospace;color:var(--faint);margin-left:auto;white-space:nowrap;padding-left:8px;}
  .ms details{min-width:0;flex:1;}
  .ms summary{cursor:pointer;list-style:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .ms summary::-webkit-details-marker{display:none;}
  .ms details[open] summary{white-space:normal;}
  .ms .full{white-space:pre-wrap;margin-top:6px;color:var(--ink);font-size:12.5px;}
  .ms .full.md{white-space:normal;}
  .ms.spin{border-style:solid;cursor:pointer;align-items:center;color:var(--ink);}
  .ms.spin:hover{background:var(--panel-2);}
  .ms.spin > *{white-space:nowrap;flex:none;}
  .ms.spin .nm{color:var(--muted);overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 0;}
  .ms.spin .dot{align-self:center;}
  .tagk.spin{background:var(--live-soft);color:var(--live);}
  .famlink{font-size:12px;color:var(--muted);margin-top:4px;}
  .famlink a,.fact.kids{cursor:pointer;color:var(--live);text-decoration:none;}
  .famlink a:hover,.fact.kids:hover{text-decoration:underline;}
  .card .foot .par{color:var(--live);}
  .newbtn{margin-left:auto;align-self:center;font:600 12px "IBM Plex Mono",monospace;color:var(--text);background:transparent;border:1px solid var(--line);border-radius:7px;padding:3px 10px;cursor:pointer;}
  .newbtn:hover{border-color:var(--live);color:var(--live);}
  .newbtn:disabled{opacity:.5;cursor:default;}
  .card.draft{border-style:dashed;}
  .card.draft .slug{font-style:italic;}
  .newmsg{font:11px "IBM Plex Mono",monospace;color:var(--muted);padding:4px 20px 0;}
  .newmsg.err{color:var(--bad, #e5534b);}
  .earlier{display:block;margin:10px auto;background:var(--panel-2);border:1px solid var(--line);border-radius:999px;padding:3px 14px;font-size:12px;color:var(--muted);cursor:pointer;}
  .earlier:hover{color:var(--ink);}
  .jump{position:sticky;bottom:12px;margin-left:auto;margin-right:16px;display:block;background:var(--accent);color:#111;border:0;border-radius:999px;padding:4px 12px;font:600 12px "IBM Plex Sans",sans-serif;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  .thread{overflow-x:hidden;}
  .msg > div, .ms details{min-width:0;}
  .msg .tx pre{max-width:100%;overflow-x:auto;}
  .projsel{background:var(--panel-2);color:var(--ink);cursor:pointer;font-family:"IBM Plex Mono",monospace;font-size:11px;padding:1px 4px;}
  .projsel:hover{border-color:var(--accent);}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-top:10px;}
  .seg button{background:var(--panel-2);border:0;border-right:1px solid var(--line);padding:3px 11px;font-size:12px;color:var(--muted);cursor:pointer;}
  .seg button:last-child{border-right:0;}
  .seg button:hover:not(:disabled){color:var(--ink);background:var(--hover);}
  .seg button.cur{background:var(--warn-soft);color:var(--ink);font-weight:600;cursor:default;}
  .seg button:disabled{opacity:.6;}
  .segmsg button[data-status]{background:var(--panel-2);color:var(--ink);border-color:var(--line);}
  .segrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .segmsg{font:11.5px "IBM Plex Mono",monospace;color:var(--faint);margin-top:10px;}
  .segmsg.err{color:var(--bad);}
  .segmsg.ok{color:var(--done);}
  .segmsg button{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad);border-radius:6px;padding:1px 8px;margin-left:6px;cursor:pointer;font:600 11px "IBM Plex Sans",sans-serif;}
  .tgl{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;}
  .tgl .sw{width:28px;height:16px;border-radius:999px;background:var(--line);position:relative;transition:.15s;}
  .tgl .sw:after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--faint);transition:.15s;}
  .tgl.on .sw{background:var(--done-soft);}
  .tgl.on .sw:after{left:14px;background:var(--done);}
  .th-h .slug .acts{margin-left:auto;display:flex;gap:6px;}
  .ch.expanded{grid-template-columns:minmax(0,1fr);}
  .ch.expanded .side,.ch.expanded .mid{display:none;}
  .ch.expanded .thread{position:static;width:auto;box-shadow:none;border-left:0;}
  .ch.expanded .th-h > *,.ch.expanded .brief,.ch.expanded .chat,.ch.expanded .nosess,.ch.expanded .day{max-width:980px;margin-left:auto;margin-right:auto;}
  .ch.expanded .brief{margin-top:14px;}
  .composer{position:sticky;bottom:0;z-index:3;background:var(--panel);border-top:1px solid var(--line);padding:10px 14px 8px;}
  .cmp-row{display:flex;gap:8px;align-items:flex-end;}
  .composer textarea{flex:1;resize:none;max-height:180px;min-height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);padding:9px 11px;font:13.5px/1.4 "IBM Plex Sans",sans-serif;outline:none;}
  .composer textarea:focus{border-color:var(--accent);}
  .composer textarea:disabled{opacity:.55;cursor:not-allowed;}
  .cmp-send{width:38px;height:38px;border-radius:9px;border:0;background:var(--accent);color:#111;font-weight:700;font-size:16px;cursor:pointer;flex:none;}
  .cmp-send:disabled{opacity:.35;cursor:not-allowed;}
  .cmp-hint{font:11px "IBM Plex Mono",monospace;color:var(--faint);margin-top:5px;min-height:14px;}
  .cmp-hint.err{color:var(--bad);}
  .cmp-hint.ok{color:var(--done);}
  .cmp-hint.busy{color:var(--warn);}
  .cmp-open{margin-left:8px;background:var(--accent);color:#111;border:0;border-radius:6px;padding:2px 10px;font:600 11.5px "IBM Plex Sans",sans-serif;cursor:pointer;}
  .msg{position:relative;}
  .msg .more{position:absolute;top:4px;right:12px;opacity:0;border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;padding:0 7px;font-size:14px;line-height:20px;cursor:pointer;}
  .msg:hover .more,.msg .more:focus-visible,.msg .more.open{opacity:1;}
  .msg .more:hover{color:var(--text);}
  #msgmenu{position:fixed;z-index:50;min-width:200px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:4px;font-size:13px;}
  #msgmenu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--text);padding:7px 10px;border-radius:5px;cursor:pointer;font:inherit;}
  #msgmenu button:hover:not(:disabled){background:var(--panel-2);}
  #msgmenu button:disabled{color:var(--faint);cursor:default;}
  #msgmenu .why{padding:2px 10px 6px;color:var(--faint);font-size:11.5px;max-width:240px;}
  .msg.pending{opacity:.55;}
  .msg.pending .tm:after{content:" · sending…";}
  .jump{bottom:12px;}
  .ch.expanded .composer > *{max-width:980px;margin-left:auto;margin-right:auto;}
  .nosess{margin:10px 18px;padding:10px 12px;border-radius:8px;background:var(--panel-2);color:var(--faint);font:12px "IBM Plex Mono",monospace;}
  @media (max-width:1100px){ .ch{grid-template-columns:220px minmax(0,1fr);} .thread{position:fixed;right:0;top:48px;bottom:0;width:min(460px,100%);box-shadow:-20px 0 40px rgba(0,0,0,.35);z-index:5;} }
  @media (max-width:720px){ .ch{grid-template-columns:1fr;} .side{display:none;} .side.show{display:block;position:fixed;inset:48px 0 0 0;z-index:6;} #menu{display:inline-block!important;} }
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <button class="ibtn" id="menu" style="display:none" title="Channels">☰</button>
    <div class="brand"><div class="logo"></div>flow</div>
    <nav class="tabs">
      <button class="tab on" data-view="channels">Channels</button>
      <button class="tab" data-view="graph">Graph</button>
    </nav>
    <div class="right">
      <div class="conn"><span class="beacon" id="beacon"></span><span id="conn">connecting</span></div>
      <button class="ibtn" id="theme" title="Toggle theme">◐</button>
    </div>
  </div>

  <div class="view" id="channelsview">
    <div class="ch">
      <aside class="pane side" id="side">
        <input class="find" id="find" placeholder="Find a channel" autocomplete="off">
        <div class="sec-h"><span>Live now</span><span class="n" id="livecount">0</span></div>
        <div id="live"></div>
        <div class="sec-h"><span>Channels</span><span class="n" id="chcount">0</span></div>
        <div id="channels"></div>
      </aside>
      <main class="pane mid" id="mid">
        <div class="placeholder">pick a channel</div>
      </main>
      <section class="pane thread" id="thread" hidden>
        <div id="thbody"></div>
        <div class="composer" id="composer" hidden>
          <div class="cmp-row">
            <textarea id="cmptext" rows="1" spellcheck="true"></textarea>
            <button class="cmp-send" id="cmpsend" title="Send (Enter)">↑</button>
          </div>
          <div class="cmp-hint" id="cmphint"></div>
        </div>
      </section>
    </div>
  </div>
  <div class="view" id="graphview" hidden></div>
</div>

<script>
(() => {
  const POLL_MS = 5000;
  const $ = (s, el=document) => el.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  // ---------- state (selection lives in the URL hash) ----------
  const st = { channels: [], live: [], cards: [], channel: null, thread: null, sess: null, filter: "all", showEarlier: false, briefOpen: false, lastOk: 0, seen: {}, showDone: false, statusMsg: null, busy: false, prompt: null, drafts: {}, pending: null, cmpSlug: null, sending: false, picked: new Set(), lastPick: null, bulk: null, launching: false, newMsg: null };
  try { st.showDone = localStorage.getItem("flowhub-showdone") === "1"; } catch(e) {}
  try { st.seen = JSON.parse(localStorage.getItem("flowhub-seen") || "{}"); } catch(e) {}
  function readHash(){ const p = new URLSearchParams(location.hash.slice(1)); return { c: p.get("c"), t: p.get("t"), v: p.get("v"), x: p.get("x") === "1" }; }
  function writeHash(h){ const p = new URLSearchParams(); if (h.v && h.v!=="channels") p.set("v", h.v); if (h.c) p.set("c", h.c); if (h.t) p.set("t", h.t); if (h.t && h.x) p.set("x", "1"); history.replaceState(null, "", "#" + p.toString()); }
  let sel = readHash();

  // ---------- time ----------
  function ago(iso){
    if (!iso) return "";
    const s = (Date.now() - new Date(iso)) / 1000;
    if (s < 60) return "just now";
    if (s < 3600) return Math.floor(s/60) + "m ago";
    if (s < 86400) return Math.floor(s/3600) + "h ago";
    return Math.floor(s/86400) + "d ago";
  }
  function dur(fromIso, toIso){
    if (!fromIso) return "";
    const s = ((toIso ? new Date(toIso) : Date.now()) - new Date(fromIso)) / 1000;
    if (s < 3600) return Math.max(1, Math.round(s/60)) + "m";
    if (s < 86400) return Math.floor(s/3600) + "h " + Math.round((s%3600)/60) + "m";
    return Math.floor(s/86400) + "d";
  }
  const hhmm = iso => { const d = new Date(iso); return String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0"); };
  const isToday = iso => iso && new Date(iso).toDateString() === new Date().toDateString();
  function dayLabel(iso){
    const d = new Date(iso), t = new Date(); const y = new Date(); y.setDate(t.getDate()-1);
    if (d.toDateString() === t.toDateString()) return "Today";
    if (d.toDateString() === y.toDateString()) return "Yesterday";
    return d.toLocaleDateString(undefined, { weekday:"short", day:"numeric", month:"short" });
  }

  // ---------- tiny markdown (escaped first, so safe) ----------
  function md(src){
    const lines = esc(src || "").split("\n"); let out = [], inList = false, inPre = false, pre = [], para = [];
    const flush = () => { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } };
    var inline = s => s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>").replace(/\[\[([^\]]+)\]\]/g, "<code>$1</code>");
    for (const ln of lines){
      if (ln.trim().startsWith("```")) { flush(); if (inPre) { out.push("<pre>" + pre.join("\n") + "</pre>"); pre = []; } inPre = !inPre; continue; }
      if (inPre) { pre.push(ln); continue; }
      const h = ln.match(/^(#{1,4})\s+(.*)/), li = ln.match(/^\s*[-*]\s+(.*)/);
      if (li || h || !ln.trim()) flush();
      if (li) { if (!inList) { out.push("<ul>"); inList = true; } out.push("<li>" + inline(li[1]) + "</li>"); continue; }
      if (inList) { out.push("</ul>"); inList = false; }
      if (h) out.push("<h" + (h[1].length+1) + ">" + inline(h[2]) + "</h" + (h[1].length+1) + ">");
      else if (ln.trim()) para.push(ln.trim());
    }
    flush();
    if (inList) out.push("</ul>"); if (inPre) out.push("<pre>" + pre.join("\n") + "</pre>");
    return out.join("");
  }

  // ---------- status vocabulary ----------
  function stateOf(c){
    if (c.status === "done") return { dot:"done", pill:"done", label: c.auto ? "done · auto " + dur(c.auto_started, c.auto_finished) : "done" };
    if (c.status === "backlog") return { dot:"backlog", pill:"backlog", label:"backlog" };
    if (c.run_state === "live") return { dot:"live", pill:"live", label: c.auto ? "auto running " + dur(c.auto_started) : "session live" };
    if (c.waiting_on) return { dot:"att", pill:"att", label: c.run_state === "crashed" ? "auto stopped · waiting" : "waiting" };
    if (c.run_state === "crashed") return { dot:"crashed", pill:"crashed", label:"auto died" };
    if (c.section === "attention") return { dot:"att", pill:"att", label: c.reason || "stale" };
    return { dot:"idle", pill:"idle", label:"idle" };
  }

  // ---------- fetch ----------
  async function getJSON(url){ const r = await fetch(url, { cache:"no-store" }); if (!r.ok) throw new Error(r.status); return r.json(); }
  function setConn(ok){ const b = $("#beacon"); b.className = "beacon " + (ok ? "ok" : "bad"); $("#conn").textContent = ok ? "live" : "disconnected"; }

  async function refresh(){
    try {
      const list = await getJSON("/api/channels");
      st.channels = list.channels || []; st.live = (list.live || []).sort((a, b) => (b.auto - a.auto));
      if (!sel.c && st.channels.length) { sel.c = st.channels[0].slug; }
      renderSide();
      if (sel.c) await loadChannel(sel.c, false);
      if (sel.t) await loadThread(sel.t, false); else $("#thread").hidden = true;
      st.lastOk = Date.now(); setConn(true);
    } catch (e) { setConn(false); }
  }
  async function loadChannel(slug, fromClick){
    try {
      const d = await getJSON("/api/channel/" + encodeURIComponent(slug));
      st.channel = d.channel; st.cards = d.cards || [];
    } catch (e) { st.channel = { slug, name: slug }; st.cards = []; }
    st.seen[slug] = new Date().toISOString(); try { localStorage.setItem("flowhub-seen", JSON.stringify(st.seen)); } catch(e) {}
    if (fromClick) { st.filter = "all"; st.showEarlier = false; $("#mid").scrollTop = 0; }
    renderMid();
  }
  // thread = milestones (/api/thread) + session chat (/api/session).
  // sess: { older:[], latest:[], liveFrom, oldest, hasMore, found }
  async function loadThread(slug, fromClick){
    const el = $("#thread");
    const fresh = fromClick || !st.sess || st.sess.slug !== slug;
    const atBottom = !fresh && el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    try {
      const th = await getJSON("/api/thread/" + encodeURIComponent(slug));
      if (th.bound) {   // Claude made the task and bound this session: open the real thread
        st.newMsg = { ch: sel.c, kind: "", text: `✓ session became task ${th.bound}` };
        if (sel.t === slug) { gotoTask(th.bound); if (sel.c) loadChannel(sel.c, false); }
        return;
      }
      if (fresh || !st.sess.found) {   // retry until the transcript exists (a new session writes it after its first turn)
        const pg = await getJSON("/api/session/" + encodeURIComponent(slug));
        st.sess = { slug, older: [], latest: pg.items, liveFrom: pg.start, oldest: pg.start, hasMore: pg.has_more, found: pg.found };
      } else if (st.sess.found) {
        const pg = await getJSON("/api/session/" + encodeURIComponent(slug) + "?from=" + st.sess.liveFrom);
        st.sess.latest = pg.items;
      }
      st.thread = th;
      st.prompt = th.status === "in-progress"
        ? await getJSON("/api/prompt/" + encodeURIComponent(slug)).catch(() => ({ ok: false, reason: "can't check the session" }))
        : null;
    } catch (e) { st.thread = null; st.sess = null; sel.t = null; writeHash(sel); el.hidden = true; return; }
    if (fromClick) st.briefOpen = false;
    renderThread();
    if (fresh || atBottom) el.scrollTop = el.scrollHeight;
    if (fromClick) focusComposer();
  }
  // put the cursor in the message box (only on deliberate actions, never on polls)
  function focusComposer(){
    const ta = $("#cmptext");
    if (!$("#composer").hidden && !ta.disabled) { ta.focus({ preventScroll: true }); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }
  async function loadEarlier(){
    const s = st.sess, el = $("#thread"); if (!s || !s.hasMore) return;
    const pg = await getJSON("/api/session/" + encodeURIComponent(s.slug) + "?before=" + s.oldest);
    const h = el.scrollHeight, top = el.scrollTop;
    s.older = pg.items.concat(s.older); s.oldest = pg.start; s.hasMore = pg.has_more;
    renderThread();
    el.scrollTop = top + (el.scrollHeight - h);
  }

  // ---------- render: sidebar ----------
  function renderSide(){
    const q = $("#find").value.trim().toLowerCase();
    $("#livecount").textContent = st.live.length;
    $("#live").innerHTML = st.live.length ? st.live.map(l => `
      <div class="row ${sel.t===l.slug?"on":""}" data-live="${esc(l.slug)}" data-ch="${esc(l.channel)}" title="${esc(l.name)}">
        <span class="dot live"></span><span class="nm mono" style="font-size:12.5px">${esc(l.slug)}</span>
        <span class="meta" title="${l.auto ? "auto run time" : "last activity"}">${l.auto ? "⚙ " + dur(l.since) : ago(l.since).replace(" ago","")}</span>
      </div>`).join("") : `<div class="empty-s">nothing running</div>`;
    const chans = st.channels.filter(c => !q || c.name.toLowerCase().includes(q) || c.slug.includes(q));
    $("#chcount").textContent = st.channels.length;
    $("#channels").innerHTML = chans.map(c => {
      const unread = sel.c !== c.slug && c.last_activity && (!st.seen[c.slug] || c.last_activity > st.seen[c.slug]);
      return `<div class="row ${sel.c===c.slug?"on":""} ${unread?"unread":""}" data-ch="${esc(c.slug)}" title="${c.total} tasks · ${c.open} open · active ${ago(c.last_activity)}">
        <span class="hash">${c.slug==="_floating"?"~":"#"}</span><span class="nm">${esc(c.name)}</span>
        ${c.live ? `<span class="badge live">${c.live}</span>` : ""}
        ${c.attention ? `<span class="badge att">${c.attention}</span>` : ""}
      </div>`;
    }).join("") || `<div class="empty-s">no match</div>`;
  }

  // ---------- render: channel ----------
  const FILTERS = [["all","All"],["active","Active"],["attention","Needs attention"],["backlog","Backlog"],["done","Done"]];
  function cardHTML(c){
    const s = stateOf(c);
    const foot = [
      c.parent ? `<span class="par" title="spun off from ${esc(c.parent)}">↖ ${esc(c.parent)}</span>` : "",
      c.messages ? `💬 ${c.messages}` : "",
      c.last_activity ? ago(c.last_activity) : "",
      c.priority === "high" ? `<span class="pri-high">high</span>` : c.priority ? c.priority : "",
      c.waiting_on ? `waiting on: ${esc(c.waiting_on)}` : "",
    ].filter(Boolean).join(" · ");
    const picked = st.picked.has(c.slug);
    return `<div class="card ${sel.t===c.slug?"on":""} ${picked?"picked":""} ${c.draft?"draft":""}" data-t="${esc(c.slug)}">
      <span class="lead"><span class="dot ${s.dot}"></span>${c.draft ? "" : `<input type="checkbox" class="pick" data-pick="${esc(c.slug)}" ${picked?"checked":""} title="Select (Shift-click for a range)">`}</span>
      <span class="slug">${c.draft ? "✎ new session" : esc(c.slug)}</span>
      <span class="pill ${s.pill}">${esc(s.label)}</span>
      ${c.name && c.name !== c.slug ? `<span class="name">${esc(c.name)}</span>` : ""}
      ${c.latest ? `<span class="latest">${esc(c.latest)}</span>` : ""}
      <span class="foot">${foot || "no activity yet"}</span>
    </div>`;
  }
  function visibleSlugs(){ return [...document.querySelectorAll("#mid .card[data-t]:not(.draft)")].map(e => e.dataset.t); }
  function bulkBarHTML(){
    const n = st.picked.size, b = st.bulk;
    if (!n && !b) return "";
    let res = "";
    if (b) {
      const bad = b.results.filter(r => !r.ok), conf = bad.filter(r => r.needs_confirm), arch = bad.filter(r => /archive it instead/.test(r.message || ""));
      res = `<div class="bulkres">${b.busy ? "updating…" : `✓ ${b.ok} ${b.status === "archive" ? "archived" : "moved to " + esc(b.status)}`}${bad.length ? ` · ${bad.length} not changed` : ""}
        ${conf.length ? `<button class="bb warn" id="bulkconfirm">Confirm ${conf.length} live anyway</button>` : ""}
        ${arch.length ? `<button class="bb" id="bulkarchivethese">Archive these ${arch.length}</button>` : ""}
        ${bad.length ? `<ul>${bad.map(r => `<li><b>${esc(r.slug)}</b>: ${esc(r.message)}</li>`).join("")}</ul>` : ""}</div>`;
    }
    return `<div class="bulkbar">${n ? `<b>${n} selected</b><span class="sep">move to</span>
      ${[["backlog","Backlog"],["in-progress","In progress"],["done","Done"]].map(([k,l]) => `<button class="bb" data-bulk="${k}" ${b && b.busy ? "disabled" : ""}>${l}</button>`).join("")}
      <span class="sep">or</span><button class="bb" data-bulk="archive" ${b && b.busy ? "disabled" : ""} title="Hide from views; undo with flow unarchive">Archive</button>
      <button class="bb ghost" id="bulkall">Select all shown</button><button class="bb ghost" id="bulkclear">Clear</button>`
      : `<button class="bb ghost" id="bulkclear">Dismiss</button>`}${res}</div>`;
  }
  async function bulkStatus(status, slugs, confirm){
    st.bulk = { status, busy: true, ok: 0, results: [] }; renderMid();
    try {
      const r = await fetch("/api/status-bulk", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ slugs, status, confirm: !!confirm }) });
      if (!r.ok) { st.bulk = { status, ok: 0, results: [{ slug: "request", ok: false, message: (await r.text()).trim() }] }; renderMid(); return; }
      const d = await r.json();
      st.bulk = { status, ok: d.ok, results: d.results };
      for (const x of d.results) if (x.ok) st.picked.delete(x.slug);   // keep failures selected
    } catch (e) { st.bulk = { status, ok: 0, results: [{ slug: "request", ok: false, message: e.message }] }; }
    await refresh();
  }
  function renderMid(){
    const ch = st.channel; if (!ch) return;
    // Two views: open work (filter chips) or, with the toggle on, done only.
    if (st.filter === "done") st.filter = "all";
    const by = k => st.cards.filter(c => c.section === k);
    const counts = { all: st.cards.length - by("done").length, active: by("active").length, attention: by("attention").length, backlog: by("backlog").length };
    let body = "";
    const group = (title, cards) => cards.length ? `<div class="grp-h">${title}</div>` + cards.map(cardHTML).join("") : "";
    const f = st.filter;
    if (st.showDone) {
      const done = by("done");
      body += group("Done today", done.filter(c => isToday(c.last_activity)));
      body += group("Done earlier", done.filter(c => !isToday(c.last_activity)));
    } else {
      if (f === "all" || f === "active") {
        // Active, split by what is actually running right now
        const act = by("active"), live = c => c.run_state === "live";
        const autos = act.filter(c => live(c) && c.auto_status === "running");
        const sessions = act.filter(c => live(c) && c.auto_status !== "running");
        const idle = act.filter(c => !live(c));
        const sub = (title, cards) => cards.length ? `<div class="sub-h">${title}<span class="n">${cards.length}</span></div>` + cards.map(cardHTML).join("") : "";
        if (act.length) body += `<div class="grp-h">Active</div>` + sub("● Live sessions", sessions) + sub("⚙ Auto runs", autos) + sub("○ Idle", idle);
      }
      if (f === "all" || f === "attention") body += group("Needs attention", by("attention"));
      if (f === "all" || f === "backlog") body += group("Backlog", by("backlog"));
    }
    $("#mid").innerHTML = `
      <div class="mid-h">
        <h2><span class="hash">${ch.slug==="_floating"?"~":"#"}</span>${esc(ch.name || ch.slug)}<button class="newbtn" id="newsess" ${st.launching ? "disabled" : ""} title="Launch a new Claude session in iTerm. Claude asks what it's about, creates the task and binds itself to it.">${st.launching ? "launching…" : "+ New"}</button></h2>
        ${st.newMsg && st.newMsg.ch === ch.slug ? `<div class="newmsg ${st.newMsg.kind}">${esc(st.newMsg.text)}</div>` : ""}
        <div class="sub">${ch.total||0} tasks · ${ch.open||0} open · ${ch.live||0} live · ${ch.attention||0} need attention</div>
        <div class="filters">${st.showDone ? `<span class="flt on">Done<span class="c">${by("done").length}</span></span>`
          : FILTERS.filter(([k]) => k !== "done").map(([k,l]) => `<button class="flt ${f===k?"on":""}" data-f="${k}">${l}<span class="c">${counts[k]}</span></button>`).join("")}
          <span class="tgl ${st.showDone ? "on" : ""}" id="donetgl" title="Switch between open and done tasks"><span class="sw"></span>Show done</span></div>
      </div>
      ${bulkBarHTML()}
      <div class="list ${st.picked.size ? "selecting" : ""}">${body || `<div class="placeholder">nothing here</div>`}</div>`;
  }

  // ---------- render: thread ----------
  const firstLine = t => (t || "").split("\n").find(l => l.trim()) || "";
  function milestoneHTML(e){
    const tm = `<span class="tm">${hhmm(e.time)}</span>`;
    switch (e.kind) {
      case "created": return `<div class="ms"><span class="tagk note">task</span><span>created</span>${tm}</div>`;
      case "auto_start": return `<div class="ms"><span class="tagk auto">auto</span><span>run started</span>${tm}</div>`;
      case "auto_end": return `<div class="ms"><span class="tagk auto">auto</span><span>run ${esc(e.body)}</span>${tm}</div>`;
      case "note": return `<div class="ms"><span class="tagk note">note</span><details><summary>${esc(e.title)}</summary><div class="full md">${md(e.body)}</div></details>${tm}</div>`;
      default: {
        const bc = e.kind === "broadcast";
        return `<div class="ms"><span class="tagk ${bc ? "broadcast" : "message"}">${bc ? "bcast" : "msg"}</span>${e.urgent ? `<span class="tagk urgent">urgent</span>` : ""}
          <details><summary><span class="who">${esc(e.from || "?")} → ${esc(e.to || "?")}</span> · ${esc(firstLine(e.body))}</summary><div class="full">${esc(e.body)}</div></details>${tm}</div>`;
      }
    }
  }
  function spinHTML(k){
    const s = stateOf(k);
    return `<div class="ms spin" data-goto="${esc(k.slug)}" title="Open ${esc(k.slug)}"><span class="tagk spin">spun off</span><span class="dot ${s.dot}"></span><b>${esc(k.slug)}</b><span class="nm">${k.name && k.name !== k.slug ? esc(k.name) : ""}</span><span class="pill ${s.pill}">${esc(s.label)}</span><span class="tm">${hhmm(k.created)}</span></div>`;
  }
  function gotoTask(slug){ sel.t = slug; writeHash(sel); renderMid(); renderSide(); loadThread(slug, true); }
  function chatHTML(it, slug){
    if (it.kind === "tools") return `<div class="tl">▸ ran ${it.tools} tool${it.tools > 1 ? "s" : ""} · ${esc(it.tool_names)}</div>`;
    const you = it.kind === "you";
    const more = you ? "" : `<button class="more" data-mi="${st.agentMsgs.push(it) - 1}" title="More actions" aria-label="More actions">⋯</button>`;
    return `<div class="msg ${it.kind}">${more}<div class="av ${it.kind}">${you ? "you" : "AI"}</div><div>

  document.addEventListener("keydown", e => { if (e.key !== "Escape" || !sel.t || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return; if (sel.x) setExpanded(false); else $("#closeth")?.click(); });
  function setExpanded(on){
    sel.x = !!on && !!sel.t; writeHash(sel);
    document.querySelector(".ch").classList.toggle("expanded", sel.x);
    const el = $("#thread"), atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
    renderThread(); if (atBottom) el.scrollTop = el.scrollHeight;
    focusComposer();
  }

  // ---------- tabs ----------
  function showView(v){
    sel.v = v; writeHash(sel);
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("on", t.dataset.view === v));
    $("#channelsview").hidden = v !== "channels"; $("#graphview").hidden = v !== "graph";
    if (v === "graph" && !$("#graphview iframe")) $("#graphview").innerHTML = `<iframe src="/graph" title="Graph"></iframe>`;
  }
  document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => showView(t.dataset.view)));

  // ---------- theme (shared key with the graph page) ----------
  const root = document.documentElement;
  try { const s = localStorage.getItem("flowhub-theme"); if (s) root.setAttribute("data-theme", s); else if (matchMedia("(prefers-color-scheme: light)").matches) root.setAttribute("data-theme","light"); } catch(e) {}
  $("#theme").addEventListener("click", () => {
    const cur = root.getAttribute("data-theme") === "light" ? "dark" : "light";
    root.setAttribute("data-theme", cur); try { localStorage.setItem("flowhub-theme", cur); } catch(e) {}
    const fr = $("#graphview iframe"); try { fr && fr.contentDocument.documentElement.setAttribute("data-theme", cur); } catch(e) {}
  });

  window.addEventListener("hashchange", () => {
    sel = readHash(); showView(sel.v === "graph" ? "graph" : "channels");
    document.querySelector(".ch").classList.toggle("expanded", !!(sel.x && sel.t));
    if (sel.c) loadChannel(sel.c, true);
    if (sel.t) loadThread(sel.t, true); else $("#thread").hidden = true;
    renderSide();
  });
  loadProjects();
  showView(sel.v === "graph" ? "graph" : "channels");
  document.querySelector(".ch").classList.toggle("expanded", !!(sel.x && sel.t));
  refresh();
  setInterval(() => { if (!document.hidden && sel.v !== "graph") refresh(); }, POLL_MS);
  // polls pause while hidden (e.g. you're in iTerm after + New): catch up on return
  document.addEventListener("visibilitychange", () => { if (!document.hidden && sel.v !== "graph") refresh(); });
})();
</script>
</body>
</html>
